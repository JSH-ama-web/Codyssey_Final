name: CI (lint + test)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (코드 스타일·정적 분석)
        run: |
          ruff format --check app api tests
          ruff check app api tests
      - name: Pytest
        shell: bash   # -o pipefail: tee를 써도 pytest 실패가 CI 실패로 전달됨
        run: pytest -v --junitxml=pytest-report.xml | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            pytest.log
            pytest-report.xml
